/* Layout: a stadium scoreboard across the top, the city diorama on the left, the head's paperwork (index-tabbed) on the right; stacks on phones.
   Look: athletic-department scoreboard plus printed school forms. Lit seven-segment numbers up top; ruled ledgers, index cards and rubber stamps below. */
:root {
  --paper: #f6f8fb; --card: #ffffff; --sunk: #e9edf3;
  --ink: #1a2132; --ink2: #475167; --ink3: #77829a; --rule: #c3d0e3; --rule2: #dbe3ee; --margin: #e09a9a; --bd: #1a2132;
  --school: #1f4e8c; --school2: #e3ac2f; --accent: #1f4e8c; --on-accent: #ffffff;
  --good: #1b7850; --warn: #a56700; --bad: #be352d; --goodbg: #dcf1e6; --warnbg: #fbecc6; --badbg: #f9dcd9;
  --board: #15181e; --board2: #1f242c; --board3: #2b313b; --board-ink: #eceff4; --board-ink2: #98a2b3; --board-line: #07090c;
  --led: #ffb22e; --led-red: #ff5a4c; --led-green: #52e08c; --led-off: rgba(255, 178, 46, .1);
  --note: #fff2a6; --note-ink: #3b3200; --tab-off: #343b47;
  --shadow: 0 2px 0 rgba(20, 26, 40, .2), 0 16px 36px rgba(20, 26, 40, .22);
  --varsity: 'Graduate', Rockwell, 'Roboto Slab', Georgia, serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --type: 'Courier Prime', 'Courier New', Courier, monospace;
  --dot: 'Doto', 'Courier New', Courier, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111a2b; --card: #18233a; --sunk: #0c1423;
  --ink: #e9eef7; --ink2: #adb8cc; --ink3: #7b89a3; --rule: #2b3c5c; --rule2: #1f2c47; --margin: #70404c; --bd: #5b6b8a;
  --good: #55cb98; --warn: #e9b655; --bad: #f3867c; --goodbg: #143627; --warnbg: #3a2e10; --badbg: #41211f;
  --board: #0d0f13; --board2: #171b21; --board3: #232830; --note: #4a421a; --note-ink: #fff3b8; --tab-off: #1d232c;

  --good: #55cb98; --warn: #e9b655; --bad: #f3867c; --goodbg: #143627; --warnbg: #3a2e10; --badbg: #41211f;

/* ---------- the scoreboard ---------- */

  background: linear-gradient(#3a414e, #262b34); border: 1px solid var(--board-line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 0 #040506 }

.vitals { display: flex; gap: 8px; overflow-x: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none }
.vitals::-webkit-scrollbar { display: none }
.vital { flex: 1 0 116px; min-width: 116px; display: grid; gap: 3px; padding: 6px 8px 7px; border-radius: 5px; background: var(--board2); border: 1px solid var(--board-line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); transition: transform .12s }
.vital:hover { transform: translateY(-1px); background: var(--board3) }
.vital small { font: 700 10.5px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--board-ink); white-space: nowrap }
.vital small::after { content: " \203A"; color: var(--board-ink2) }
.vital .led { display: flex; align-items: center; height: 30px; padding: 0 7px; border-radius: 3px; background: #050709; box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255, 255, 255, .07); color: var(--led); overflow: hidden }
.vital em { font: 600 10.5px var(--cond); font-style: normal; letter-spacing: .07em; text-transform: uppercase; color: var(--board-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.vital em.up { color: var(--led-green) } .vital em.down { color: var(--led-red) }
.ledsvg { display: block; height: 20px; width: auto; overflow: visible; filter: drop-shadow(0 0 3px currentColor) }
.ledsvg .off { fill: var(--led-off) } .ledsvg .on { fill: currentColor } .ledsvg text { fill: currentColor; font: 700 15px var(--cond) }
.bulbs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px }
.bulbs i { height: 4px; border-radius: 1px; background: #2a3039 }
.bulbs i.on { background: var(--bc, var(--led)); box-shadow: 0 0 5px var(--bc, var(--led)) }

/* ---------- stage and map ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 450px); min-height: 0 }
.mapwrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #9fc8e6 }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block }
#map.drag { cursor: grabbing }
.map-tools { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; max-width: calc(100% - 70px) }
.seg, .zoom { display: flex; background: var(--board); border: 1px solid var(--board-line); border-radius: 6px; padding: 3px; gap: 3px; box-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 8px 18px rgba(0, 0, 0, .25) }

.seg button[aria-pressed="true"] { background: var(--led); color: #241600; box-shadow: 0 0 10px rgba(255, 178, 46, .45) }
.zoom { position: absolute; top: 10px; right: 12px; flex-direction: column }
.zoom button { width: 34px; height: 32px; border-radius: 4px; display: grid; place-items: center; font: 700 19px var(--cond); color: var(--board-ink); background: var(--board3) }
.zoom button:hover { background: #3b4350 }
.zoom .only-phone { display: none }
.maplegend { display: flex; align-items: center; gap: 7px; font: 700 11.5px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--board-ink); padding: 8px 10px; background: var(--board); border: 1px solid var(--board-line); border-radius: 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, .35); white-space: nowrap }
.maplegend i { display: block; width: 64px; height: 8px; border-radius: 1px; background: linear-gradient(90deg, var(--c0), var(--c1)) }
.map-hint { flex-basis: 100%; max-width: 340px; padding: 8px 11px; border-radius: 2px; background: var(--note); color: var(--note-ink); font-size: 13px; line-height: 1.35; box-shadow: 2px 3px 0 rgba(0, 0, 0, .25); transform: rotate(-.6deg) }
.paused { position: absolute; right: 12px; bottom: 44px; padding: 8px 14px; border-radius: 4px; background: var(--board); border: 1px solid var(--led); color: var(--led); font: 900 13px var(--dot); letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 6px rgba(255, 178, 46, .6); box-shadow: 0 0 0 3px var(--board), 0 6px 18px rgba(0, 0, 0, .4); white-space: nowrap; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 24px) }
.paused svg { animation: blink 1.4s steps(2, jump-none) infinite }
.paused:hover { background: #20252e }
.ticker { position: absolute; left: 0; right: 0; bottom: 0; padding: 7px max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px)); background: #07090c; border-top: 2px solid #23282f; color: var(--led); font: 700 13px var(--dot); letter-spacing: .03em; text-shadow: 0 0 5px rgba(255, 178, 46, .45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ticker b { color: #8a6a2a; margin-right: 10px; font-weight: 900 }
.card { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 46px; width: min(350px, calc(100% - 24px)); background: var(--card); border: 2px solid var(--bd); border-radius: 3px; box-shadow: 5px 6px 0 rgba(0, 0, 0, .3); padding: 0 14px 14px; display: grid; gap: 10px; max-height: calc(100% - 104px); overflow-y: auto }
.card h3 { font: 400 16px var(--varsity); letter-spacing: .03em; text-transform: uppercase; margin: 0 -14px; padding: 9px 42px 8px 14px; background: var(--school); color: #fff; border-bottom: 3px solid var(--school2) }
.card .x, .modal .x { position: absolute; top: 5px; right: 6px; width: 28px; height: 28px; border-radius: 3px; display: grid; place-items: center; color: #fff; font-size: 20px; z-index: 2 }
.card .x:hover, .modal .x:hover { background: rgba(255, 255, 255, .2) }
.blurb { color: var(--ink2); font-size: 13.5px }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px }
.kv div { display: grid; padding: 5px 0; border-bottom: 1px solid var(--rule) }
.kv small, .lbl { font: 700 10.5px var(--cond); letter-spacing: .11em; text-transform: uppercase; color: var(--ink3) }
.kv b { font-family: var(--type); font-weight: 700; font-size: 15px }
.stack { display: flex; height: 14px; border: 1.5px solid var(--bd); background: var(--sunk) }
.stack i { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--ink2) }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--c); margin-right: 5px; border: 1px solid var(--bd) }

/* ---------- the paperwork ---------- */
.side { display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--paper); min-height: 0; min-width: 0; border-left: 3px solid var(--board-line) }
.tabs { display: flex; gap: 3px; overflow-x: auto; padding: 8px 8px 0; background: var(--board); scrollbar-width: none }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: 1 0 auto; display: grid; justify-items: center; gap: 1px; padding: 6px 8px 6px; position: relative; font: 700 11.5px var(--cond); letter-spacing: .07em; text-transform: uppercase; color: var(--board-ink2); background: var(--tab-off); border-radius: 7px 7px 0 0; border-top: 3px solid transparent }
.tabs button:hover { color: var(--board-ink) }

.tabs button .dot { position: absolute; top: 1px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--led-red); color: #fff; font: 700 10.5px/16px var(--cond); font-style: normal; text-align: center; box-shadow: 0 0 8px rgba(255, 90, 76, .7) }
.tabs button .dot.s1 { min-width: 7px; width: 7px; height: 7px; padding: 0; top: 4px; right: 6px; background: var(--led); box-shadow: 0 0 6px rgba(255, 178, 46, .8) }
.panel { overflow-y: auto; display: grid; gap: 20px; align-content: start; min-width: 0; padding: 16px max(18px, env(safe-area-inset-right, 0px)) 30px 38px;
  background: linear-gradient(90deg, transparent 24px, var(--margin) 24px, var(--margin) 25.500px, transparent 25.500px) }
.sec { display: grid; gap: 9px; min-width: 0 }

  background: linear-gradient(var(--accent), var(--accent)) 0 100% / 100% 3px no-repeat, linear-gradient(var(--school2), var(--school2)) 0 calc(100% - 4.500px) / 100% 1.500px no-repeat }
.sec > h3 small { font: 600 11.5px var(--cond); letter-spacing: .06em; color: var(--ink3); text-transform: uppercase; text-align: right }
.hint { font-size: 13px; color: var(--ink2) }
.big { font-family: var(--varsity); font-size: 30px; line-height: 1.1; letter-spacing: .01em }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0 }
.row > span:first-child { min-width: 0 }
.rows { display: grid }
.rows > * { padding: 7px 2px; border-bottom: 1px solid var(--rule) }
.rows .tot { font: 700 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-top: 11px }
.neg { color: var(--bad) } .pos { color: var(--good) }

.meter.good { --mc: var(--good) } .meter.warn { --mc: var(--warn) } .meter.bad { --mc: var(--bad) }
.alert { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 2px; border-bottom: 1px solid var(--rule); font-size: 13.5px }
.alert::before { content: "!"; flex: none; width: 18px; height: 18px; margin-top: 1px; display: grid; place-items: center; font: 700 13px var(--cond); background: var(--ink3); color: var(--paper) }
.alert.s2::before { background: var(--bad) } .alert.s1::before { background: var(--warn) } .alert.s0::before { content: "i" }
.alert.s2 { font-weight: 600 }

function rn(S, mu, sd) {
  const u = Math.max(1e-9, rnd(S)), v = rnd(S);
  return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v);
}
const pick = (S, arr) => arr[Math.floor(rnd(S) * arr.length)];
function binom(S, n, p) {
  n = Math.round(n);
  if (n <= 0) return 0;
  p = clamp(p, 0, 1);
  if (n > 60) return clamp(Math.round(rn(S, n * p, Math.sqrt(n * p * (1 - p)))), 0, n);
  let k = 0;
  for (let i = 0; i < n; i++) if (rnd(S) < p) k++;
  return k;
}

function money(x, signed) {
  const neg = x < 0, a = Math.abs(x);
  let s;
  if (a >= 1e6) s = '$' + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  else if (a >= 1e3) s = '$' + Math.round(a / 1e3) + 'k';
  else s = '$' + Math.round(a);
  return (neg ? '−' : signed ? '+' : '') + s;
}

/* The city: a 41x41 tile grid with a river, a street grid, nine neighborhoods and the campus. Pure data, no drawing. */
const CITY_G = 41;
const T_LOT = 0, T_ROAD = 1, T_WATER = 2, T_BRIDGE = 3, T_CAMPUS = 5;

function riverC(seed, i) {
  const p = hash(seed, 1, 7) * 6.283, q = hash(seed, 2, 7) * 6.283;
  return 9.6 + 2.0 * Math.sin(i / 5 + p) + 0.7 * Math.sin(i / 2.3 + q);
}
const inCampus = (i, j) => i >= CAMPUS.i0 && i < CAMPUS.i1 && j >= CAMPUS.j0 && j < CAMPUS.j1;

const _layouts = {};
function cityLayout(seed) {
  if (_layouts[seed]) return _layouts[seed];
  const G = CITY_G, type = new Uint8Array(G * G), nb = new Int8Array(G * G);
  const cent = NB_TYPES.map((t, k) => ({ i: t.c[0] + (hash(seed, k, 11) - 0.5) * 2.4, j: t.c[1] + (hash(seed, k, 12) - 0.5) * (t.north ? 1 : 2.4) }));
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const k = j * G + i, rc = riverC(seed, i);
    let t = T_LOT;
    if (inCampus(i, j)) t = T_CAMPUS;
    else if (Math.abs(j + 0.5 - rc) < 1.45) t = i % 4 === 0 ? T_BRIDGE : T_WATER;
    else if (i % 4 === 0 || j % 4 === 0) t = T_ROAD;
    type[k] = t;
    if (t === T_CAMPUS) { nb[k] = -2; continue; }
    if (t === T_WATER) { nb[k] = -1; continue; }
    const north = j + 0.5 < rc;
    let best = -1, bd = 1e9;
    for (let n = 0; n < NB_TYPES.length; n++) {
      if (!!NB_TYPES[n].north !== north) continue;
      const d = Math.hypot(i - cent[n].i, j - cent[n].j) / NB_TYPES[n].w;

/* Rolls the living part of the city that the sim tracks and saves. */

/* The simulation. One call to tick(S) advances one week. Everything here is plain data in, plain data out (no DOM),

/* ---------- basic measures ---------- */

    { label: 'Baseline', v: 8 },
    { label: 'Teaching quality', v: EQavg(S) * 0.5 },

/* ---------- money ---------- */
function progCost(S, k, lvl, st, ci) {
  const m = mission(S), eff = 1.04 - 0.02 * sk(S, 'business');
  return Math.pow(lvl, 1.25) * (28000 + 85 * st) * ci * ((m.disc && m.disc[k]) || 1) * eff;
}
function auxNet(S, st, ci) {
  const lvl = S.prog.aux; let v = lvl * (32000 + 90 * st) * ci * (1 + 0.04 * sk(S, 'business'));
  if (lvl >= 1) v += ((has(S, 'arts') ? 40000 : 0) + (has(S, 'fieldhouse') ? 60000 : 0) + (has(S, 'dining') ? 30000 : 0) + (has(S, 'turf') ? 50000 : 0)) * ci;
  if (has(S, 'elc')) v += 150000 * ci;
  return v * (1 + pSum(S, 'aux'));
}
function enrolledWealth(S) {
  let a = 0, n = 0; S.nbE.forEach((v, k) => { a += v * S.city.nbs[k].inc; n += v; });
  return n ? a / n / (110 * S.costIdx) : 1;
}
function fundAnnual(S, ignoreCampaign) {
  const st = students(S), fam = st / 1.55, m = mission(S), adv = sk(S, 'advancement');
  const part = fundParticipation(S);
  const gift = 1700 * Math.pow(enrolledWealth(S), 1.3) * S.costIdx * (1 + 0.25 * S.city.econ);
  const trustees = (100000 + 300 * st) * S.costIdx * (0.6 + S.board / 150);
  const alumni = S.alumni * 0.07 * (190 + 25 * S.prog.ath) * S.costIdx * (0.7 + S.rep / 160);

}
function fundParticipation(S) { return clamp(0.34 + (S.sat - 50) * 0.008 + sk(S, 'advancement') * 0.03 + (mission(S).part || 0) + pSum(S, 'part'), 0.12, 0.95); }
const busCost = (S) => 85000 * S.costIdx * S.drift * (1 + pSum(S, 'bus'));
function teamCost(S) { let v = 0; for (const r of ROLES) if (S.team[r.id]) v += S.team[r.id].salary * 1.25; return v; }

/* Annualized budget at today's settings. Overrides let the budget meeting look a year ahead. */
function budget(S, o) {

  let upkeep = 0; for (const b of S.bld) upkeep += bValue(S, b) * cm * S.drift * 0.017;

const bannerCount = (S) => Object.keys(S.banners || {}).length;

/* What the head's days in one place are doing right now, in words. */

/* ---------- board goals ---------- */
const GOALS = {

  reserve: { val: (S) => S.cash, text: (g) => 'Build cash reserves to ' + money(g.x), fmt: (v) => money(v) },
  surplus: { val: (S) => S.flags.surplusYears, text: (g) => 'Finish ' + (g.x === 1 ? 'a year' : g.x + ' straight years') + ' in the black', fmt: (v) => v + ' so far' },
  rep: { val: (S) => S.rep, text: (g) => 'Raise reputation to ' + g.x, fmt: (v) => Math.round(v) },
  pay: { val: (S) => S.salaryIdx * 100, text: (g) => 'Bring faculty pay to ' + g.x + '% of market', fmt: (v) => Math.round(v) + '%' },
  sig: { val: (S) => sigCount(S), text: () => 'Open a signature building', fmt: (v) => v + ' built' },

  cond: { val: (S) => avgCond(S), text: (g) => 'Bring campus condition to ' + g.x, fmt: (v) => Math.round(v) },
  sat: { val: (S) => S.sat, text: (g) => 'Lift family satisfaction to ' + g.x, fmt: (v) => Math.round(v) },
  access: { val: (S) => aidShare(S) * 100, text: (g) => 'Have ' + g.x + '% of students on financial aid', fmt: (v) => Math.round(v) + '%' },

  c.push({ type: 'rep', x: Math.min(92, Math.round(S.rep + 6)) });

/* ---------- city news ---------- */
function rivalMoves(S) {

    const x = rnd(S);
    if (x < 0.1) { r.rep = clamp(r.rep + 5, 20, 95); log(S, r.name + ' opens a new building. Their reputation climbs.', 'city'); }
    else if (x < 0.17) { r.rep = clamp(r.rep - 6, 20, 95); log(S, r.name + ' is in the news for the wrong reasons. Their reputation slips.', 'city'); }
    else if (x < 0.24 && S.rep > r.rep) { r.tuition *= 0.95; log(S, r.name + ' freezes tuition to win families back from you.', 'city'); }
  }

    c.rivals.push({ id: 'charter', name: 'Meridian Charter Academy', nb: home.id, ci: home.ci + 2, cj: home.cj - 2, north: false, tuition: 0, rep: 52, rep0: 52, bias: -1.1, k8: false, open: true, blurb: 'Free, new and oversubscribed. Draws families who would have needed aid.' });
    log(S, 'Meridian Charter Academy opens in ' + home.name + '. It is free, and it is good.', 'city');

  else if (x < 0.2) { const nb = pick(S, c.nbs); nb.pq0 = clamp(nb.pq0 + 6, 20, 90); log(S, 'Voters in ' + nb.name + ' pass a school levy. The public schools there will improve.', 'city'); }
  else if (x < 0.28) { const nb = pick(S, c.nbs); nb.pq0 = clamp(nb.pq0 - 6, 20, 90); log(S, 'Budget cuts hit the public schools in ' + nb.name + '. Families are looking around.', 'city'); }
}

      { label: 'Open the doors.', run: (S) => { const eq = EQavg(S); if (eq >= 62) { applyFx(S, { rep: [5, 100], apps: [12, 70] }, 'Newspaper feature'); return 'The piece is a love letter: small classes, a physics teacher who builds trebuchets, seniors who can hold a conversation. The phone rings for a month.'; } if (eq >= 52) { applyFx(S, { rep: [1, 60] }, 'Newspaper feature'); return 'A fair, mixed piece. "Good teachers, tired buildings." You have read worse.'; } applyFx(S, { rep: [-4, 100], sat: [-2, 40] }, 'Newspaper feature'); return 'The headline is "$25,000 a Year for This?" with a photo of a ceiling tile.'; }, note: 'The story will reflect your real teaching quality.' },
      { label: 'Decline politely.', fx: {}, text: 'She writes the story about another school instead.' },
    ] },
  { id: 'transfer', w: 2, when: (S) => S.prog.ath >= 2, title: 'The Recruit', who: 'Basketball coach',
    text: () => 'The best ninth-grade point guard in the state wants to transfer in. His grades are thin and his family needs full aid. Your coach has not slept.',
    choices: [
      { label: 'Admit him with full aid.', fx: { cash: -28000, rep: [1.5, 80], morale: [-2, 40] }, run: (S) => { S.grades[9].n++; S.grades[9].aid += 1; S.grades[9].an++; }, text: 'The gym is full every Friday. Some faculty wonder aloud what the admission standards are for people under six feet.' },
      { label: 'Admit him with full aid and a real support plan.', fx: { cash: -45000, rep: [1.5, 80], sat: [1, 40] }, run: (S) => { S.grades[9].n++; S.grades[9].aid += 1; S.grades[9].an++; }, text: 'A tutor, an advisor, and a coach who checks homework before practice. By junior year he is on the honor roll.' },
      { label: 'Hold to the standard.', fx: { morale: [2, 30] }, text: 'He enrolls across town and scores 31 against you in February.' },
    ] },
  { id: 'trustee', w: 2, title: 'The Trustee’s Son', who: 'Upper School head',
    text: () => 'A trustee’s son was caught with a stolen exam. The handbook says suspension and a note to colleges. The trustee chairs your compensation committee.',
    choices: [
      { label: 'Apply the handbook.', fx: { board: -4, morale: [4, 50], sat: [1, 30] }, text: 'The trustee is icy for a year. The faculty will run through walls for you.' },
      { label: 'Find a "learning-centered alternative."', fx: { board: 2, morale: [-6, 60] }, text: 'He writes a reflection essay.', risk: { p: 0.4, fx: { sat: [-4, 50], rep: [-2, 60] }, text: 'Students know exactly what happened. The honor council resigns in a group.' } },
    ] },
  { id: 'camp', w: 2, when: (S) => S.prog.aux <= 3 && season(S) !== 'summer', title: 'Summer Tenants', who: 'A national camp operator',
    text: () => 'A sports-camp company wants to rent the whole campus for eight weeks next summer for $130,000. Your facilities crew uses those weeks for repairs.',
    choices: [
      { label: 'Sign the lease.', fx: { cash: 130000, morale: [-1.5, 40] }, run: (S) => { for (const b of S.bld) b.cond = Math.max(5, b.cond - 1.5); }, text: 'The check clears. The gym floor needs refinishing a year early, and summer repairs slip.' },
      { label: 'Rent only the fields and gym.', fx: { cash: 55000 }, text: 'Less money, less wear, and the roofers still get their eight weeks.' },
      { label: 'No. Summer is for the campus.', fx: {}, text: 'The campus rests.' },
    ] },
  { id: 'ransom', w: 2, title: 'Encrypted', who: 'IT director',
    text: () => 'Every file on the school’s servers has been encrypted. The attackers want $70,000. Report cards are due in ten days. The last full backup is from October.',
    choices: [
      { label: 'Rebuild from the backup.', fx: { cash: -45000, morale: [-3, 30], sat: [-1, 20] }, text: 'Two weeks of teachers retyping grades from paper. Nothing is paid to criminals, and the new backups run nightly.' },
      { label: 'Pay.', fx: { cash: -70000 }, text: 'The key works.', risk: { p: 0.3, fx: { rep: [-3, 60], cash: -40000 }, text: 'The key works, and then the family data shows up for sale anyway. You are legally required to tell every parent.' } },
    ] },
  { id: 'windfall', w: 2, when: (S) => yr(S) >= 1 && S.city.rivals[2] && S.city.rivals[2].open, title: 'A School Closes', who: 'Director of Admission',
    text: (S) => S.city.rivals[2].name + ' has announced it will close in June. Forty families are suddenly looking, and most of them are looking at you. They are used to paying half your tuition.',
    choices: [
      { label: 'Welcome them with a transition discount.', run: (S) => { const add = admitWave(S, 34, 0.35); S.city.rivals[2].open = false; applyFx(S, { rep: [1.5, 60], sat: [-1, 30] }, 'Parish families'); return add + ' students enroll with two years of reduced tuition. Classes are fuller and the hallways louder. A few current parents ask why they pay full price.'; }, tags: [['good', 'Enrollment ▲'], ['bad', 'Aid ▲']] },
      { label: 'Admit those who can pay and qualify.', run: (S) => { const add = admitWave(S, 12, 0); S.city.rivals[2].open = false; return add + ' students enroll at full tuition. The rest scatter to public schools and the charter.'; }, tags: [['good', 'Enrollment ▲']] },
    ] },
  { id: 'union', w: 3, when: (S) => S.morale < 38, title: 'Cards Are Being Signed', who: 'A friendly warning',
    text: () => 'A teacher you trust tells you quietly that a union organizer met with faculty at a coffee shop on Tuesday. Thirty people came.',
    choices: [
      { label: 'Meet the faculty and put real money on the table.', fx: { cash: -150000, morale: [10, 80], board: -2 }, text: 'An emergency salary adjustment and a standing faculty compensation committee. The organizer stops returning calls.' },
      { label: 'Hire a labor lawyer.', fx: { cash: -70000, morale: [-6, 80], rep: [-2, 60] }, text: 'Mandatory "informational meetings." The vote fails narrowly. The faculty room goes quiet when you walk in.' },
      { label: 'Recognize the union.', fx: { morale: [8, 100], board: -6 }, run: (S) => { S.flags.union = true; }, text: 'A first contract takes a year to negotiate. Pay scales are now public, predictable and not entirely yours to set.' },
    ] },
  { id: 'accred', w: 2, when: (S) => yr(S) >= 2 && !S.flags.accred, title: 'The Visiting Team', who: 'Regional accreditation',
    text: () => 'Twelve educators from other schools spend four days in your classrooms, your files and your budget. Their report goes to the board.',
    choices: [
      { label: 'Show them everything.', run: (S) => { S.flags.accred = true; const eq = EQavg(S), fin = projNet(S) >= 0; let n = 0; if (eq >= 62) n++; if (fin) n++; if (S.morale >= 55) n++; if (avgCond(S) >= 60) n++; applyFx(S, { board: (n - 2) * 3, rep: [(n - 2) * 1.5, 80] }, 'Accreditation report'); return n >= 3 ? 'Full reaccreditation with commendations for teaching and stewardship. The chair of the visiting team asks if you are hiring.' : n === 2 ? 'Reaccredited, with a list of "major recommendations" the board reads very carefully.' : 'Reaccredited on a shortened term, with a required progress report on finances and facilities. The board chair wants to talk.'; }, note: 'They grade teaching, finances, morale and campus.' },
    ] },
  { id: 'legacyfam', w: 3, when: (S) => S.lastTuitionPct >= 6, title: 'Four Children, One Email', who: 'A third-generation family',
    text: (S) => 'A family with four children enrolled says the ' + S.lastTuitionPct + '% increase is the last straw. Their grandfather’s name is on the library door.',
    choices: [
      { label: 'Offer a sibling discount, for everyone.', fx: { cash: -70000, sat: [3, 60] }, text: 'A new sibling discount, school-wide. It costs real money and several large families stop touring elsewhere.' },
      { label: 'Offer them a private arrangement.', fx: { cash: -25000 }, text: 'They stay.', risk: { p: 0.4, fx: { sat: [-4, 50] }, text: 'They stay, and they tell people. By Friday the business office has eleven requests for "the same deal."' } },
      { label: 'Hold firm.', fx: { sat: [-2, 40], giving: [-5, 60] }, run: (S) => { for (const g of [1, 4, 7, 10]) if (S.grades[g].n > 4) S.grades[g].n--; }, text: 'They withdraw all four. The name stays on the library door, which is awkward for everyone.' },
    ] },
  { id: 'solarkids', w: 2, when: (S) => !has(S, 'solar'), title: 'A Student Proposal', who: 'The Environmental Club',
    text: () => 'Six students present a forty-slide plan for a composting program and a pilot solar canopy over the parking lot. They have done the math. Most of it is right.',
    choices: [
      { label: 'Fund the pilot.', fx: { cash: -38000, sat: [2, 50], rep: [1, 60] }, text: 'The canopy powers the lower school office. The students present at a state conference and one of them is quoted in the paper.' },
      { label: 'Praise the work, fund the compost bins.', fx: { cash: -3000, sat: [0.5, 20] }, text: 'They get compost bins. They are polite about it.' },
    ] },
  { id: 'merit', w: 2, when: (S) => profileAvg(S) > 54, title: 'A Banner Year', who: 'College counseling',
    text: () => 'Four National Merit finalists, a Regeneron semifinalist and a debate team headed to nationals. The admission office wants to buy a billboard.',
    choices: [
      { label: 'Buy the billboard.', fx: { cash: -22000, apps: [10, 60], rep: [1.5, 60] }, text: 'It goes up on the highway into downtown. Inquiries rise, and so does the pressure on next year’s juniors.' },
      { label: 'Tell the story in the alumni magazine.', fx: { giving: [6, 50], rep: [0.5, 40] }, text: 'Alumni love it. A few write checks.' },
    ] },
  { id: 'roof', w: 3, when: (S) => avgCond(S) < 52 && season(S) !== 'winter', title: 'Buckets in the Hallway', who: 'Head of maintenance',
    text: (S) => 'The roof over ' + BUILDINGS[worstBuilding(S).t].name + ' has failed in three places. A tour of prospective families walked past the buckets this morning.',
    choices: [
      { label: 'Replace the roof.', fx: { cash: -150000 }, run: (S) => { worstBuilding(S).cond = Math.min(100, worstBuilding(S).cond + 18); }, text: 'Six weeks of scaffolding and a roof that will outlast you.' },
      { label: 'Patch the leaks.', fx: { cash: -30000, sat: [-2, 40], apps: [-5, 40] }, text: 'The buckets come and go with the weather. Tour guides learn a new route.' },
    ] },
  { id: 'dinner', w: 2, when: (S) => !!S.campaign, title: 'The Lead Gift', who: 'Director of Advancement',
    text: () => 'The campaign needs a lead gift. One family could give it. They have asked for dinner with you, alone, and they have questions about where the school is going.',
    choices: [
      { label: 'Share the honest plan, problems included.', run: (S) => { if (S.rep >= 55 || S.board >= 65) { S.campaign.final *= 1.15; return 'They appreciate being treated like adults. The pledge arrives the next week and lifts the whole campaign.'; } S.campaign.final *= 0.97; return 'They listen carefully and decide to "wait and see." Fair enough.'; }, tags: [['good', 'Campaign ▲ if the school is on solid ground']] },
      { label: 'Sell the dream.', run: (S) => { if (rnd(S) < 0.5) { S.campaign.final *= 1.2; return 'You are good at this. They pledge more than you asked for.'; } S.campaign.final *= 0.92; return 'They have read your audit. The dream did not match the footnotes.'; }, tags: [['warn', 'A coin flip']] },
    ] },
  { id: 'snow', w: 3, when: (S) => season(S) === 'winter', title: 'Six Inches by Morning', who: 'Director of Facilities, 9:15 p.m.',
    text: () => 'The forecast says six inches by morning, or possibly none. Every other school in the city is waiting to see what you do, and several hundred families are refreshing their email.',
    choices: [
      { label: 'Close now, so families can plan.', fx: { sat: [1.5, 20] }, text: 'It snows eight inches. You are, briefly, the most popular adult in the city.',
        risk: { p: 0.35, fx: { sat: [-3, 25] }, text: 'The storm misses by forty miles and the sun is out by nine. Parents with jobs will bring this up until June.' } },
      { label: 'Call a two-hour delay.', fx: {}, text: 'The plows get through. A two-hour delay pleases nobody and harms nobody, which is the point of one.',
        risk: { p: 0.3, fx: { sat: [-4, 40], rep: [-1, 40] }, text: 'A bus slides into a ditch at 9:40. Nobody is hurt. Everybody has a phone.' } },
      { label: 'Decide at 5 a.m. with real information.', fx: { morale: [-2, 20] }, text: 'You make the right call at 5:10 a.m. The teachers who left home at 5:00 have feelings about it.' },
    ] },
  { id: 'prank', w: 2, when: (S) => season(S) === 'spring', title: 'Goat Number Three', who: 'Upper School head, out of breath',
    text: () => 'The seniors have released three goats in the Upper School, wearing the numbers 1, 2 and 4. Facilities has spent two hours looking for goat number 3.',
    choices: [
      { label: 'Laugh, and tell the story at commencement.', fx: { sat: [2, 40], morale: [-1.5, 30] }, text: 'The seniors adore you. The custodians, who met the goats first, adore you somewhat less.' },
      { label: 'Seniors clean up and cook breakfast for the facilities crew.', fx: { cash: -1500, sat: [1.5, 40], morale: [2.5, 40] }, text: 'Forty seniors in aprons flip pancakes for the maintenance staff. The goats go home. It is the best assembly of the year.' },
      { label: 'Bar the organizers from senior week.', fx: { sat: [-2.5, 40], morale: [1, 20] }, text: 'Rules are rules. The class gift this year is noticeably small.' },
    ] },
  { id: 'offer', w: 2, when: (S) => yr(S) >= 3 && S.rep >= 55, title: 'A Call from a Search Firm', who: 'A consultant you have met twice',
    text: () => 'A larger school two states away is looking for a head, and your name came up. The salary is half again what you make. She only wants "a conversation."',
    choices: [
      { label: 'Tell your board chair about the call, and stay.', fx: { board: 3 }, text: 'She is quiet for a moment, then thanks you for telling her. Your next contract reflects the conversation.' },
      { label: 'Take the conversation quietly.', fx: {}, text: 'It is flattering. On the flight home you realize you have unfinished work here.',
        risk: { p: 0.45, fx: { board: -7, morale: [-3, 40] }, text: 'A trustee’s college roommate sits on that search committee. Your chair hears about it at a wedding.' } },
      { label: 'Say no before she finishes the pitch.', fx: { morale: [1, 30] }, text: 'You tell no one. Somehow the faculty know by Friday, and they are pleased.' },
    ] },
  { id: 'gala', w: 3, when: (S) => season(S) !== 'summer', title: 'The Auction Catalog', who: 'Parents’ Association',
    text: () => 'The spring gala catalog is ready for your approval. Among the live auction items: front-row seats at graduation, a reserved parking space, and first choice of next year’s homeroom teacher.',
    choices: [
      { label: 'Approve it all. It is for the school.', fx: { cash: 70000, sat: [-3, 50], morale: [-3, 40] }, text: 'A record night. The teacher item sells for $9,000, and every family that could not bid learns exactly what was for sale.' },
      { label: 'Strike the teacher item and keep the rest.', fx: { cash: 45000, morale: [1.5, 30] }, text: 'A good night. The parking space goes for more than a used car.' },
      { label: 'Make it a free community night instead.', fx: { cash: -12000, sat: [3, 50], giving: [3, 40] }, text: 'Potluck tables, a student band and no paddles. It raises nothing that night. The annual fund has a good spring.' },
    ] },
  { id: 'viral', w: 2, when: (S) => S.fq > 48, title: 'Eleven Million Views', who: 'Director of Communications',
    text: () => 'A history teacher has been explaining the Peloponnesian War online with sock puppets. The videos have eleven million views. A streaming company has called him, and three parents have called you.',
    choices: [
      { label: 'Give him a studio and one fewer class.', fx: { cash: -20000, apps: [9, 70], rep: [1.5, 60], morale: [-1.5, 30] }, text: 'Admission tours now stop at his door. Several colleagues ask where their studios are.' },
      { label: 'Let it ride.', fx: { apps: [4, 40] }, text: 'The views keep climbing. So do inquiries.',
        risk: { p: 0.3, fx: { cash: -15000, sat: [-3, 40] }, text: 'A student whose family had opted out of all photography is clearly visible in episode nine. Lawyers are involved, briefly and expensively.' } },
      { label: 'Ask him to keep the school out of it.', fx: { morale: [-2, 30] }, text: 'He complies, and keeps teaching.',
        risk: { p: 0.4, fx: { fq: -0.8, sat: [-1, 30] }, text: 'He complies until June, then signs with the streaming company. The sock puppets go with him.' } },
    ] },
  { id: 'ap', w: 2, when: (S) => S.prog.acad >= 2 && !S.flags.apAsk, title: 'Drop the APs?', who: 'Academic council',
    text: () => 'The department chairs want to replace Advanced Placement courses with seminars of their own design. They say the tests have become the curriculum. Parents of juniors have heard, and they have a group chat.',
    choices: [
      { label: 'Adopt the school’s own advanced courses.', fx: { eq: [2.5, 140], morale: [4, 60], sat: [-3, 50] }, run: (S) => { S.flags.apAsk = 1; }, text: 'Teachers rebuild their courses over the summer with real energy. Parents ask, at every coffee, how colleges will know what an A means.',
        risk: { p: 0.3, fx: { rep: [-2, 80] }, text: 'The courses are better. Two colleges nonetheless say they "could not assess the rigor" of this year’s transcripts, and that sentence travels.' } },
      { label: 'Run both for three years and compare.', fx: { cash: -60000, eq: [1, 100] }, text: 'More sections, more cost, and real evidence at the end of it.' },
      { label: 'Keep the APs.', fx: { morale: [-2.5, 40] }, text: 'The chairs accept it. The proposal goes back in the drawer it came from.' },
    ] },
  { id: 'mascot', w: 2, when: (S) => !S.flags.mascot, title: 'The Mascot', who: 'Student council',
    text: () => 'Two hundred students have signed a petition to retire the school mascot, a scowling Colonel last redrawn in 1958. An alumni group has answered with a petition of its own, and a banner.',
    choices: [
      { label: 'Retire the Colonel. Let students choose what is next.', fx: { sat: [2, 50], giving: [-8, 70], rep: [1, 40] }, run: (S) => { S.flags.mascot = 1; later(S, 'mascot2', 30); }, text: 'The Colonel is retired with a ceremony more dignified than he was. Several classes from the 1970s pause their giving.' },
      { label: 'Keep the Colonel.', fx: { giving: [3, 40], sat: [-2, 40] }, run: (S) => { S.flags.mascot = 1; }, text: 'The Colonel scowls on. Students start wearing him ironically, which is worse.' },
      { label: 'Appoint a committee.', fx: { morale: [-1, 20] }, run: (S) => { S.flags.mascot = 1; later(S, 'mascot2', 44); }, text: 'The committee meets nine times and holds two listening sessions. It will report next year.' },
    ] },
  { id: 'mascot2', w: 0, title: 'The Vote', who: 'Student council',
    text: () => 'The ballots are in for a new mascot. The finalists are the Herons, the Foxes and, thanks to a write-in campaign nobody can trace, the Fighting Geese.',
    choices: [
      { label: 'Announce the winner: the Herons.', fx: { cash: -18000, sat: [1.5, 40] }, text: 'New uniforms, a new logo on the gym floor and a seven-foot heron costume. Kindergarten is thrilled.' },
      { label: 'Honor the write-in. Geese it is.', fx: { cash: -18000, sat: [3, 50], rep: [1, 50] }, text: 'The Fighting Geese sell more sweatshirts in a month than the Colonel sold in a decade. Opposing teams are unsettled.',
        risk: { p: 0.25, fx: { giving: [-4, 50] }, text: 'The sweatshirts sell out in a week. A few donors of a certain age ask whether the school still takes itself seriously.' } },
    ] },
  { id: 'security', w: 2, title: 'The Front Door', who: 'A full parents’ meeting',
    text: () => 'After a frightening week in the national news, three hundred parents fill the gym. They want to know who can walk into this school, and what you are going to do about it.',
    choices: [
      { label: 'Build a secure entrance and hire a safety director.', fx: { cash: -150000, sat: [3.5, 70] }, text: 'A staffed vestibule, new locks and a calm professional who knows every child’s name by October.' },
      { label: 'Train the staff and fix the locks.', fx: { cash: -40000, sat: [1.5, 50], morale: [1, 30] }, text: 'Threat-assessment training, working locks and a plan everyone has practiced. Less visible, and most of what the experts recommend.' },
      { label: 'Send a reassuring letter.', fx: { sat: [-3.5, 60] }, text: 'The letter is well written. It is forwarded widely, with commentary.' },
    ] },
  { id: 'land', w: 2, when: (S) => yr(S) >= 1 && !S.flags.landAsk, title: 'The Lot Next Door', who: 'A neighbor of forty years',
    text: (S) => 'The widow who owns the two acres behind the athletic fields is moving to be near her grandchildren. A developer has offered her ' + money(1400000 * S.costIdx) + '. She would rather sell to the school for ' + money(1100000 * S.costIdx) + ', if you can decide by Friday.',
    choices: [
      { label: 'Buy it.', fx: { board: 1 }, run: (S) => { const c = 1100000 * S.costIdx; S.flags.landAsk = 1; S.flags.land = true; if (S.cash < c + 250000 * S.costIdx) { takeDebt(S, c); S.cash -= c; S.ytd.capital += c; return 'The bank lends against the land itself, and the school grows by two acres. Faculty Housing and the Stadium will now cost far less to build.'; } S.cash -= c; S.ytd.capital += c; }, text: 'You pay cash, and the school grows by two acres. Faculty Housing and the Stadium will now cost far less to build.', tags: (S) => [['bad', S.cash < 1350000 * S.costIdx ? 'Debt +' + money(1100000 * S.costIdx) : money(-1100000 * S.costIdx)], ['good', 'Housing and Stadium cost 40% less']] },
      { label: 'Thank her and pass.', run: (S) => { S.flags.landAsk = 1; const nb = S.city.nbs.find((n) => n.type === 'south'); nb.kids += 14; applyFx(S, { sat: [-1.5, 50] }, 'Construction next door'); }, text: 'Forty townhouses go up along the fence line. The construction is loud. The families who move in are young.', tags: [['bad', 'Families ▼'], ['good', 'More children nearby']] },
    ] },
  { id: 'counsel', w: 2, when: (S) => S.prog.coll >= 2 && (season(S) === 'fall' || season(S) === 'winter'), title: 'One Phone Call', who: 'Parents of a senior',
    text: () => 'A senior has applied early to the university his father attended. His parents want your college counselor to call the dean of admission and "advocate." She has explained that it does not work that way. They would now like you to make the call.',
    choices: [
      { label: 'Back the counselor.', fx: { morale: [3, 50], giving: [-5, 50] }, text: 'He is deferred, then admitted in April. The parents credit their own persistence.' },
      { label: 'Make the call yourself.', fx: { giving: [5, 40], morale: [-4, 50] }, text: 'The dean is courteous. Your counselor is not, for some weeks.',
        risk: { p: 0.4, fx: { rep: [-2, 80] }, text: 'The dean is courteous and makes a note. Your next three applicants there are wait-listed.' } },
      { label: 'Invite the family in to talk through the whole list.', fx: { sat: [1, 30], morale: [1, 30] }, text: 'An hour with you and the counselor, a longer list and a calmer family. Mostly.' },
    ] },
  { id: 'remit', w: 2, when: (S) => !S.flags.remitAsk, title: 'Faculty Children', who: 'Faculty council',
    text: () => 'Teachers’ children attend at half tuition. The faculty council asks for full remission. "We teach everyone else’s children here," the letter says. "Most of us cannot afford to send our own."',
    choices: [
      { label: 'Full remission, starting this fall.', fx: { morale: [6, 120] }, run: (S) => { S.flags.remit = true; S.flags.remitAsk = 1; }, text: 'Nine faculty children enroll in September. Job postings now draw twice the applicants.', tags: [['good', 'Stronger hires for good'], ['bad', '−$85k every year']] },
      { label: 'Raise it to 75%.', fx: { cash: -35000, morale: [3, 60] }, run: (S) => { S.flags.remitAsk = 1; }, text: 'A real step. The council thanks you and notes, politely, that it is a step.' },
      { label: 'Not this year.', fx: { morale: [-3.5, 50] }, run: (S) => { S.flags.remitAsk = 1; }, text: 'You explain the budget. A veteran teacher enrolls her twins across town, where her husband teaches.' },
    ] },
  { id: 'lice', w: 2, when: (S) => season(S) === 'fall', title: 'A Note Home', who: 'School nurse',
    text: () => 'The Lower School has lice. Not a class. The Lower School.',
    choices: [
      { label: 'Bring in professional screeners for every grade.', fx: { cash: -9000, sat: [1, 30] }, text: 'Two days, every head checked, done. Parents are grateful in the way people are grateful to a dentist.' },
      { label: 'Send the letter and trust families to check.', fx: {}, text: 'It clears up in a week.',
        risk: { p: 0.5, fx: { sat: [-2.5, 40], morale: [-1.5, 30] }, text: 'It does not clear up. The second wave reaches the faculty room, and then your house.' } },
    ] },
  { id: 'speaker', w: 2, when: (S) => season(S) === 'winter' || season(S) === 'spring', title: 'The Commencement Speaker', who: 'Senior class officers',
    text: () => 'The seniors have voted for their commencement speaker: an alumna who is now a famous comedian. Her act includes ten minutes about this school. Your board chair has already invited a senator.',

    /* Re-rendering replaces the button that was pressed; hand keyboard focus to its replacement. */
    if (document.activeElement === document.body || !document.contains(document.activeElement)) {
      const again = Array.from(document.querySelectorAll('[data-act="' + act + '"]')).find((x) => x.dataset.arg === arg);
      if (again && !again.disabled) again.focus({ preventScroll: true });
    }
    return;
  }
  if (ev.target.classList && ev.target.classList.contains('scrim') && $('modal').querySelector('.x')) ACT.closeModal();
});
document.addEventListener('input', (ev) => {
  const el = ev.target, S = App.S;
  if (el.id === 'su-name') { App.setup.name = el.value; S.name = el.value || 'Your School'; renderTop(); return; }
  if (el.dataset.set) { SETTERS[el.dataset.set](S, +el.value); refreshLive(); renderTop(); return; }
  if (el.dataset.m) {
    const k = el.dataset.m, v = +el.value;
    if (k.indexOf('admit') === 0) App.m.admit[+k.slice(5)] = v; else App.m[k] = v;
    modalLive(MODALS[App.modal](S, S.pending.find((p) => p.block)));
  }
});
document.addEventListener('change', (ev) => { if (ev.target.dataset && ev.target.dataset.set) { App.dragging = false; renderAll(); save(); } });
document.addEventListener('pointerdown', (ev) => { if (ev.target.type === 'range') App.dragging = true; });
document.addEventListener('pointerup', () => { App.dragging = false; });
document.addEventListener('keydown', (ev) => {
  const t = ev.target, tag = t.tagName || '';
  if (tag === 'INPUT' && t.type === 'text') return;
  if (ev.key === 'Tab' && App.modal) {
    const box = $('modal').querySelector('.modal'), f = Array.from(box.querySelectorAll('button:not(:disabled), input, summary, [href]'));
    if (!f.length) return; const a = document.activeElement, first = f[0], last = f[f.length - 1];
    if (!box.contains(a) || a === box) { ev.preventDefault(); (ev.shiftKey ? last : first).focus(); }
    else if (ev.shiftKey && a === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && a === last) { ev.preventDefault(); first.focus(); }
    return;
  }
  if (ev.key === 'Escape') { if (App.modal) { if ($('modal').querySelector('.x')) ACT.closeModal(); } else if (App.card) ACT.closeCard(); return; }
  if (App.modal || App.setup || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const onControl = tag === 'BUTTON' || tag === 'INPUT' || tag === 'SUMMARY' || tag === 'A', k = ev.key;
  const step = (d) => { const i = TABS.findIndex((x) => x[0] === App.tab); ACT.tab(TABS[(i + d + TABS.length) % TABS.length][0]); };
  if (k === ' ') { if (onControl) return; ev.preventDefault(); ACT.speed(App.speed ? 0 : (App.lastSpeed || 1)); }
  else if (tag === 'INPUT') return;
  else if (k === '1' || k === '2' || k === '3') ACT.speed(+k);
  else if (k === '[' || k === ']') step(k === '[' ? -1 : 1);
  else if ((k === 'ArrowLeft' || k === 'ArrowRight') && t.getAttribute && t.getAttribute('role') === 'tab') { ev.preventDefault(); step(k === 'ArrowLeft' ? -1 : 1); const sel = $('tabs').querySelector('[aria-selected="true"]'); if (sel) sel.focus(); }
  else if (k === '+' || k === '=') ACT.zoom(1.3);
  else if (k === '-' || k === '_') ACT.zoom(0.77);
  else if (k === '0' || k === 'Home') ACT.center();
  else if (t.id === 'map' && k.indexOf('Arrow') === 0) { ev.preventDefault(); App.map.pan(k === 'ArrowLeft' ? -70 : k === 'ArrowRight' ? 70 : 0, k === 'ArrowUp' ? -70 : k === 'ArrowDown' ? 70 : 0); }
});

/* ---------- map input ---------- */
function bindMap(cv) {
  const pts = new Map(); let moved = 0, pinch = 0;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, pos(e)); moved = 0; if (pts.size === 2) { const a = Array.from(pts.values()); pinch = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); } cv.classList.add('drag'); });
  cv.addEventListener('pointermove', (e) => {
    const p = pos(e), m = App.map;
    if (!pts.has(e.pointerId)) { const h = m.pickAt(p[0], p[1]); m.hover = h && h.type === 'nb' ? h : null; cv.style.cursor = h ? 'pointer' : 'grab'; return; }
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, p);
    if (pts.size === 1) { const dx = p[0] - prev[0], dy = p[1] - prev[1]; moved += Math.abs(dx) + Math.abs(dy); m.cam.x -= dx / m.cam.z; m.cam.y -= dy / m.cam.z; m.userMoved = true; m.clampCam(); }
    else if (pts.size === 2) { const a = Array.from(pts.values()), d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]); if (pinch > 0) m.zoomAt((a[0][0] + a[1][0]) / 2, (a[0][1] + a[1][1]) / 2, d / pinch); pinch = d; moved += 10; }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return; const p = pts.get(e.pointerId); pts.delete(e.pointerId); cv.classList.remove('drag');
    if (moved < 10 && pts.size === 0 && !App.setup) {
      const h = App.map.pickAt(p[0], p[1]);
      if (h && !App.ui.mapHint) { App.ui.mapHint = true; saveUI(); }
      if (!h) App.card = null;
      else if (h.type === 'campus') { ACT.tab('campus'); return; }
      else { App.card = h; if (h.type === 'nb') tourMark('map'); }
      renderCard(); renderMapChrome(); if (App.tab === 'admissions') renderPanel();
    }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { App.map.hover = null; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const p = pos(e); App.map.zoomAt(p[0], p[1], Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
}

/* ---------- loop ---------- */
function consumeLog() {
  const S = App.S, i = S.log.lastIndexOf(App.lastLog), fresh = S.log.slice(i + 1);
  for (const l of fresh) {
    if (l.kind === 'good' || l.kind === 'bad' || l.kind === 'city') toast(l);
    if (l.fx) { App.map.burst(l.fx); beep(l.fx === 'opening' ? 'bell' : 'good'); } else if (l.kind === 'bad') beep('bad');
  }
  if (S.log.length) App.lastLog = S.log[S.log.length - 1];
}
function afterTick() {
  const S = App.S; consumeLog(); renderTop();
  if (wk(S) % 4 === 0) {
    save();
    if (App.dragging) refreshLive();
    else { const open = Array.from($('panel').querySelectorAll('details')).map((d) => d.open); renderPanel(); $('panel').querySelectorAll('details').forEach((d, k) => { if (open[k]) d.open = true; }); }
    renderCard();
  } else refreshLive();
  showPending();
}
let lastTs = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0); lastTs = ts;
  const S = App.S;
  if (S && !App.setup && !App.modal && App.speed > 0 && !S.over) {
    App.acc += dt; const per = [0, 1.5, 0.7, 0.28][App.speed]; let n = 0;
    while (App.acc >= per && n < 2) { App.acc -= per; n++; if (!tick(S)) { App.acc = 0; break; } afterTick(); if (S.pending.some((p) => p.block) || S.over) { App.acc = 0; break; } }
  }
  App.map.draw(dt, App.speed > 0 && !App.modal && !App.setup);
  requestAnimationFrame(frame);
}

/* Fast-forwards with default choices. Used by the local test page (?auto=1&ff=60). */
function autoPlay(weeks) {
  const S = App.S; let guard = 0;
  while (weeks > 0 && !S.over && guard++ < 5000) {
    for (const p of S.pending.slice()) {
      if (p.type === 'budget') commitBudget(S, Math.round((S.infl * 100 + 1.5) * 2) / 2, Math.round((S.infl * 100 + 0.5) * 2) / 2);
      else if (p.type === 'admit') commitAdmissions(S, defaultAdmit(S), Math.min(maxAid(S), defaultAid(S)));
      else if (p.type === 'review') ackReview(S, false);
      else if (p.type === 'event') resolveEvent(S, p.id, 0);
      else if (p.type === 'plan') commitPlan(S, p.opts[0]);
      else clearPending(S, p.type);
    }
    if (tick(S)) weeks--;
  }
  App.lastLog = S.log[S.log.length - 1];
}

function boot(data) {
  loadUI();
  const cv = $('map'); App.map = new MapView(cv); bindMap(cv);
  App.dark = isDark(); App.map.night = App.dark;
  if (window.ResizeObserver) new ResizeObserver(() => App.map.resize()).observe(cv.parentNode); else window.addEventListener('resize', () => App.map.resize());
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
  if (window.MutationObserver) new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) { document.documentElement.setAttribute('data-theme', q.get('theme')); App.dark = isDark(); App.map.night = App.dark; }
  if (data && data.S && data.S.v === 1) { App.map.resize(); startGame(migrate(data.S)); }
  else if (q.get('auto')) {
    { const st = document.createElement('style'); st.textContent = '*{animation:none!important}'; document.head.appendChild(st); }
    const seed = +(q.get('seed') || 7);
    App.map.resize();
    startGame(newGame({ seed, name: q.get('name') || 'Hawthorne Academy', colors: SCHOOL_COLORS[+(q.get('col') || 0)], emblem: 'tree', motto: 'Learn by Doing', mission: q.get('mission') || 'prep', scenario: q.get('sc') || 'turnaround' }));
    if (q.get('ff')) { clearPending(App.S, 'intro'); closeModal(); autoPlay(+q.get('ff')); }
    if (q.get('build')) for (const t of q.get('build').split(',')) { App.S.campaignFund += 2e7; startBuild(App.S, t, 'cash'); if (q.get('done')) { App.S.builds.forEach((b) => (b.left = 1)); autoPlay(1); } }
    if (q.get('ev')) queueEvent(App.S, q.get('ev'));
    if (q.get('pillars')) for (const id of q.get('pillars').split(',')) commitPlan(App.S, id);
    if (q.get('plan')) App.S.pending.push({ type: 'plan', block: true, opts: PILLARS.filter((p) => !App.S.plan.includes(p.id)).slice(+q.get('plan') - 1, +q.get('plan') + 2).map((p) => p.id) });
    if (q.get('ban')) BANNERS.slice(0, +q.get('ban')).forEach((b, k) => (App.S.banners[b.id] = App.S.week - k * 30));
    if (q.get('days')) q.get('days').split(',').forEach((d, k) => { App.S.time[TIME_AREAS[k].id] = +d; App.S.timeE[TIME_AREAS[k].id] = timeCurve(+d) * 0.6; });
    if (q.get('over')) endGame(App.S, q.get('over'));
    if (q.get('fresh')) App.ui = { seen: {}, tour: {}, tourOff: false, mapHint: false };
    if (q.get('seen')) { App.ui.tourOff = true; App.ui.mapHint = true; TABS.forEach((t) => (App.ui.seen[t[0]] = 1)); }
    if (q.get('tab')) App.tab = q.get('tab');
    if (q.get('ov')) App.map.overlay = q.get('ov');
    if (q.get('z')) { App.map.cam.z = +q.get('z'); App.map.userMoved = true; }
    if (q.get('nb')) App.card = { type: 'nb', id: +q.get('nb') };
    if (q.get('speed')) App.speed = +q.get('speed');
    renderAll();
    if (q.get('test') && typeof runUiTest === 'function') { runUiTest(); requestAnimationFrame(frame); return; }
    if (q.get('show')) { const k = q.get('show'); if (k === 'help' || k === 'drivers' || k === 'cands' || k === 'build' || k === 'menu' || k === 'year') showModal(k, q.get('arg'), { dismiss: true }); else { App.modal = null; $('modal').innerHTML = ''; showPending(); } }
  } else openSetup();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S: App.setup ? null : App.S }));
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
